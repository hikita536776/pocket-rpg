name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf automake autopoint \
            libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython==0.29.37"

      - name: Run game tests
        run: python -m unittest discover -s tests -v

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-ubuntu24-${{ hashFiles('buildozer.spec') }}

      - name: Build debug APK
        run: yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Show error
        if: failure()
        run: grep -n -i -E "error|failed" build.log | tail -40

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-rpg-apk
          path: bin/*.apk
